<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // No-flash theme bootstrap: must run synchronously, before first
      // paint, so a saved explicit choice doesn't flash the wrong theme
      // while the app hydrates. Mirrors src/hooks/useTheme.ts — same
      // localStorage key, same values. 'system' (or nothing stored)
      // intentionally sets no attribute, leaving prefers-color-scheme in
      // src/index.css in control.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <title>Güvenay İnşaat – Geleceği İnşa Ediyoruz</title>
    <meta name="description" content="30 yılı aşkın deneyimle konut, ticari ve endüstriyel projeler. Güvenay İnşaat ile hayalinizdeki yapıya kavuşun." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Güvenay İnşaat – Geleceği İnşa Ediyoruz" />
    <meta property="og:description" content="30 yılı aşkın deneyimle konut, ticari ve endüstriyel projeleri zamanında ve eksiksiz teslim ediyoruz." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;900&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html { background: #F8FAFC; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #0B1220; }
      }
      html[data-theme="dark"] { background: #0B1220; }
      html[data-theme="light"] { background: #F8FAFC; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
